name: Personal APK

# Build a personal, installable APK on demand.
# No releases, no notifications, no secrets required: the debug signing key
# is app/persistent-debug.keystore, committed in the repo.

# workflow_dispatch only becomes available once this file reaches the default
# branch, so pushes to the working branches build too.
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor'
        type: choice
        default: foss
        options:
          - foss
          - gms
  push:
    branches:
      - 'claude/**'
      - 'fix/video-player-bugs'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-personal-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-personal-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build APK
        run: |
          FLAVOR='${{ inputs.flavor || 'foss' }}'
          # assembleUniversalFossDebug / assembleUniversalGmsDebug
          TASK="assembleUniversal$(echo "${FLAVOR:0:1}" | tr '[:lower:]' '[:upper:]')${FLAVOR:1}Debug"
          echo "Running $TASK"
          ./gradlew "$TASK" --no-daemon --stacktrace

      - name: Name the artifact
        id: naming
        run: |
          VERSION=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | awk -F '"' '{print $2}')
          echo "name=Echo-$VERSION-${{ inputs.flavor || 'foss' }}-personal" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.naming.outputs.name }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
